spring:
  application:
    name: putevodika-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/putevodika
    username: putevodika
    password: putevodika

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

app:
  security:
    jwt:
      issuer: putevodika-backend
      access-token-ttl: PT30M
      secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs