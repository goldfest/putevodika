<aside xmlns:th="http://www.thymeleaf.org"
       th:fragment="sidebar"
       class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-logo">П</div>
        <div>
            <div class="brand-title">Путеводика</div>
            <div class="brand-subtitle">Администрирование</div>
        </div>
    </div>

    <nav class="sidebar-nav" aria-label="Основная навигация">
        <div class="nav-section-title">ОСНОВНОЕ</div>
        <a th:href="@{/admin}" class="nav-item"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">Главная</a>

        <div class="nav-section-title">УПРАВЛЕНИЕ</div>
        <a th:href="@{/admin/users}" class="nav-item"
           th:classappend="${activePage == 'users'} ? ' active' : ''">Пользователи</a>
        <a th:href="@{/admin/places}" class="nav-item"
           th:classappend="${activePage == 'places'} ? ' active' : ''">Туристические объекты</a>
        <a th:href="@{/admin/import/osm}" class="nav-item"
           th:classappend="${activePage == 'import'} ? ' active' : ''">Импорт OSM</a>

    <div class="sidebar-footer">Putevodika Admin</div>
