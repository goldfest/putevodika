<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход | Putevodika Admin</title>

    <link rel="stylesheet"
          th:href="@{/admin/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/admin/css/login.css}">
</head>

<body>

<main class="login-screen">

    <section class="login-card">

        <div class="login-brand">
            <div class="login-brand-icon">П</div>

            <div class="login-brand-name">
                Путеводика
            </div>
        </div>

        <div class="login-heading">
            <h1>Вход в админ-панель</h1>

            <p>
                Введите данные учётной записи
                администратора.
            </p>
        </div>

        <div th:if="${loginError}"
             th:text="${loginError}"
             class="login-alert"
             role="alert">
        </div>

        <form th:action="@{/admin/login}"
              th:object="${loginForm}"
              method="post"
              class="login-form">

            <div class="form-group">

                <label for="email">
                    Электронная почта
                </label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="example@mail.ru"
                        autocomplete="username"
                        maxlength="320"
                        required>

            </div>

            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required>

            </div>

            <button type="submit"
                    class="login-button">
                Войти
            </button>

        </form>

        <div class="login-footer">
            Доступ только для администраторов
            Putevodika
        </div>

    </section>

</main>

</body>
</html>
