services:

  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: putevodika-postgres

    environment:
      POSTGRES_DB: putevodika
      POSTGRES_USER: putevodika
      POSTGRES_PASSWORD: putevodika

    ports:
      - "5433:5432"

    volumes:
      - putevodika-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U putevodika -d putevodika"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  redis:
    image: redis:8-alpine
    container_name: putevodika-redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    restart: unless-stopped


  mailpit:
    image: axllent/mailpit:latest
    container_name: putevodika-mailpit

    # SMTP 1025 доступен backend-контейнеру внутри compose-сети.
    ports:
      - "8025:8025"

    restart: unless-stopped


  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian
    container_name: putevodika-osrm

    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/ulyanovsk_oblast-latest.osrm

    ports:
      - "5000:5000"

    volumes:
      - ./osrm-data:/data:ro

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: putevodika-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/putevodika
      SPRING_DATASOURCE_USERNAME: putevodika
      SPRING_DATASOURCE_PASSWORD: putevodika

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-no-reply@putevodika.local}

      OSRM_BASE_URL: http://osrm:5000

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}

      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      osrm:
        condition: service_started

    restart: unless-stopped


volumes:
  putevodika-postgres-data:
